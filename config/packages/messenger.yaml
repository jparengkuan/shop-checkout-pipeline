framework:
    messenger:
        # Messages that still fail after all retries are parked here instead of dropped.
        # Inspect them in the RabbitMQ UI ("failed" queue); retry with: bin/console messenger:failed:retry
        failure_transport: failed

        transports:
            # Publish side: every OrderEvent goes to the "orders" topic exchange.
            # It also declares every consumer queue, so no message is lost when a
            # message is published before its worker has ever started.
            # The exchange and each queue's bindings are defined once here (&anchors)
            # and reused by the consume side (*aliases), so they cannot drift apart.
            orders:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange: &orders_exchange
                        name: orders
                        type: topic
                    queues:
                        # Step 1 for a new order: write the invoice, then publish order.invoiced.
                        order_invoices: &order_invoices_queue
                            binding_keys: ['order.placed']
                        # Step 2: send the confirmation (with invoice) and the payment email.
                        # Bound to order.invoiced, not order.placed, so the invoice always exists.
                        order_emails: &order_emails_queue
                            binding_keys: ['order.invoiced', 'order.paid']

            # Consume side: one transport per consumer, each reading only its own queue.
            # Consumed by the invoice-worker (see .ddev/messenger-worker.sh).
            order_invoices:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange: *orders_exchange
                    queues:
                        order_invoices: *order_invoices_queue

            # Consumed by the email-worker (see .ddev/messenger-worker.sh).
            order_emails:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange: *orders_exchange
                    queues:
                        order_emails: *order_emails_queue

            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: failed
                        type: fanout
                    queues:
                        failed: ~

        routing:
            # Every order event goes to the publish transport; the exchange routes it
            # to the queues by routing key (see App\Service\OrderEventPublisher).
            'App\Message\OrderEvent': orders
